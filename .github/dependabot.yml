version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/analysis"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "pokemon-tcg-pocket-cards"
    groups:
      card-data:
        patterns:
          - "pokemon-tcg-pocket-cards"
        group-by: "dependency-name"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "automated"
    open-pull-requests-limit: 1
  - package-ecosystem: "npm"
    directory: "/workers/kofi"
    schedule:
      interval: "weekly"
    groups:
      kofi-receiver:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "automated"
    open-pull-requests-limit: 1
