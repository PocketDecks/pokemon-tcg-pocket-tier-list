name: Analysis Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: "yarn"
          cache-dependency-path: "analysis/yarn.lock"

      - name: Install dependencies
        run: |
          cd analysis
          yarn install --frozen-lockfile

      - name: Typecheck
        run: |
          cd analysis
          yarn typecheck

      - name: Run tests
        run: |
          cd analysis
          yarn test
