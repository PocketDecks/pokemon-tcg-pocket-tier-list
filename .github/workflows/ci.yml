name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          workspace: root

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test:ci
        env:
          CI: true

      - name: Run script tests
        run: yarn test:scripts

      - name: Setup Java for the Firestore emulator
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Test Firestore rules
        run: yarn test:rules

  analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          workspace: analysis

      - name: Typecheck
        run: |
          cd analysis
          yarn typecheck

      - name: Run tests
        run: |
          cd analysis
          yarn test

  kofi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          workspace: kofi

      - name: Typecheck Ko-fi receiver
        run: yarn --cwd workers/kofi typecheck

      - name: Test Ko-fi receiver
        run: yarn --cwd workers/kofi test:ci

      - name: Bundle Ko-fi receiver
        run: yarn --cwd workers/kofi wrangler deploy --dry-run --outdir dist-dry
