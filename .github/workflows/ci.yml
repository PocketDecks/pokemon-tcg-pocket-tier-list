name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          workspace: root

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test:ci
        env:
          CI: true

      - name: Run script tests
        run: yarn test:scripts

      - name: Setup Java for the Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Test Firestore rules
        run: yarn test:rules

  analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          workspace: analysis

      - name: Typecheck
        run: |
          cd analysis
          yarn typecheck

      - name: Run tests
        run: |
          cd analysis
          yarn test

  kofi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          workspace: kofi

      - name: Typecheck Ko-fi receiver
        run: yarn --cwd workers/kofi typecheck

      - name: Test Ko-fi receiver
        run: yarn --cwd workers/kofi test:ci

      - name: Bundle Ko-fi receiver
        run: yarn --cwd workers/kofi wrangler deploy --dry-run --outdir dist-dry
