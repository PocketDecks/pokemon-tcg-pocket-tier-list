name: Deploy
"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: deploy-live
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check main freshness after checkout
        id: early_latest
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$HEAD_SHA" = "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale job for $HEAD_SHA."
          fi
      - uses: ./.github/actions/setup
        if: steps.early_latest.outputs.is_latest == 'true'
        with:
          workspace: root
      - run: yarn build:site
        if: steps.early_latest.outputs.is_latest == 'true'
        env:
          VITE_FIREBASE_APIKEY: ${{ secrets.VITE_FIREBASE_APIKEY }}
          VITE_FIREBASE_AUTHDOMAIN: ${{ secrets.VITE_FIREBASE_AUTHDOMAIN }}
          VITE_FIREBASE_PROJECTID: ${{ secrets.VITE_FIREBASE_PROJECTID }}
          VITE_FIREBASE_STORAGEBUCKET: ${{ secrets.VITE_FIREBASE_STORAGEBUCKET }}
          VITE_FIREBASE_MESSAGINGSENDERID: ${{ secrets.VITE_FIREBASE_MESSAGINGSENDERID }}
          VITE_FIREBASE_APPID: ${{ secrets.VITE_FIREBASE_APPID }}
      - uses: ./.github/actions/setup
        if: steps.early_latest.outputs.is_latest == 'true'
        with:
          workspace: analysis
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.early_latest.outputs.is_latest == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_PREMIUM_VERIFIER }}
      - run: yarn verify:premium
        if: steps.early_latest.outputs.is_latest == 'true'
        working-directory: analysis
      - name: Check whether this commit is still current
        id: latest
        if: steps.early_latest.outputs.is_latest == 'true'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$HEAD_SHA" = "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment for $HEAD_SHA."
          fi
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        if: "${{ steps.early_latest.outputs.is_latest == 'true' && steps.latest.outputs.is_latest == 'true' }}"
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEMON_TCG_POCKET_TIER_LIST }}"
          channelId: live
          projectId: pokemon-tcg-pocket-tier-list
