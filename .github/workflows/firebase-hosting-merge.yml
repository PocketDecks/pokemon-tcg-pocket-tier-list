# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24.19.0 broke the deploy action's preview-link posting; this is
          # the documented-good build for it.
          node-version: 24.18.1
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      # Node is pinned for the whole job: firebase-tools still hits a
      # node-fetch@v2 premature-close bug on newer runner defaults.
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
      - run: yarn test:ci
        env:
          CI: true
      - run: yarn test:scripts
      - run: yarn install --frozen-lockfile
        working-directory: analysis
      - run: yarn typecheck
        working-directory: analysis
      - run: yarn test
        working-directory: analysis
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEMON_TCG_POCKET_TIER_LIST }}"
          channelId: live
          projectId: pokemon-tcg-pocket-tier-list
