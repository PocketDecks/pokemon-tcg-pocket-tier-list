name: Frontend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: "yarn"
          cache-dependency-path: |
            yarn.lock
            workers/kofi/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test:ci
        env:
          CI: true

      - name: Run script tests
        run: yarn test:scripts

      - name: Install Ko-fi receiver dependencies
        run: yarn --cwd workers/kofi install --frozen-lockfile

      - name: Typecheck Ko-fi receiver
        run: yarn --cwd workers/kofi typecheck

      - name: Test Ko-fi receiver
        run: yarn --cwd workers/kofi test:ci
