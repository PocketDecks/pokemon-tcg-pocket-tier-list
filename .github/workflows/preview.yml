name: Preview
"on": pull_request
concurrency:
  group: "preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          workspace: root
      - run: yarn check:generated
      # Dependabot runs cannot read repository secrets, and Firebase's getAuth()
      # throws on an empty apiKey, so no page prerenders and the build fails.
      # They build with placeholders instead. The deploy step is skipped for
      # Dependabot, so the placeholders never ship.
      - run: yarn build
        env:
          VITE_FIREBASE_APIKEY: ${{ github.actor == 'dependabot[bot]' && 'dependabot-placeholder' || secrets.VITE_FIREBASE_APIKEY }}
          VITE_FIREBASE_AUTHDOMAIN: ${{ github.actor == 'dependabot[bot]' && 'placeholder.invalid' || secrets.VITE_FIREBASE_AUTHDOMAIN }}
          VITE_FIREBASE_PROJECTID: ${{ github.actor == 'dependabot[bot]' && 'placeholder' || secrets.VITE_FIREBASE_PROJECTID }}
          VITE_FIREBASE_STORAGEBUCKET: ${{ github.actor == 'dependabot[bot]' && 'placeholder.invalid' || secrets.VITE_FIREBASE_STORAGEBUCKET }}
          VITE_FIREBASE_MESSAGINGSENDERID: ${{ github.actor == 'dependabot[bot]' && '0' || secrets.VITE_FIREBASE_MESSAGINGSENDERID }}
          VITE_FIREBASE_APPID: ${{ github.actor == 'dependabot[bot]' && 'placeholder' || secrets.VITE_FIREBASE_APPID }}
      - run: yarn test:ci
        env:
          CI: true
      - run: yarn test:scripts
      - uses: ./.github/actions/setup
        with:
          workspace: analysis
      - run: yarn typecheck
        working-directory: analysis
      - run: yarn test
        working-directory: analysis
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEMON_TCG_POCKET_TIER_LIST }}"
          projectId: pokemon-tcg-pocket-tier-list
