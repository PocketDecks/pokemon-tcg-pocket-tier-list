name: Sync pairings

# The local cron misses new archetypes when the machine is off. This CI job
# runs the stateless scraper weekly; scoring stays local with the 443 MB store.
on:
  schedule:
    # Mondays 10:00 UTC, once weekend decklists are up.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: "yarn"
          cache-dependency-path: "analysis/yarn.lock"

      - name: Install dependencies
        run: |
          cd analysis
          yarn install

      - name: Sync pairings
        run: |
          cd analysis
          yarn sync-pairings

      - name: Open a pull request if the pairings changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f analysis/src/data/limitless-decks.json ]; then
            echo "limitless-decks.json missing after scrape; store path moved or scraper failed."
            exit 1
          fi

          if [ -z "$(git status --porcelain analysis/src/data/limitless-decks.json)" ]; then
            echo "No listing changes today."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automated/pairings-$(date -u +%F)"
          # Reuse the date branch on re-runs; -B resets it so a second run cannot fail on a duplicate.
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          git add analysis/src/data/limitless-decks.json
          git commit -m "chore(data): sync deck listings from Limitless"
          # Fetch the branch so --force-with-lease checks against the real remote, not a stale local ref.
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"

          gh label create automated 2>/dev/null || true
          # Open a PR only if one is not already open for this branch.
          if ! gh pr list --head "$BRANCH" --state open --json number | grep -q number; then
            gh pr create \
              --base main \
              --title "Sync deck pairings ($(date -u +%F))" \
              --body "Automated weekly scrape of Limitless deck pairings. New partners are folded onto existing archetypes; nothing is pruned." \
              --label automated
          fi
