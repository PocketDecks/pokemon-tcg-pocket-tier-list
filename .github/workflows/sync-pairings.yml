name: Sync pairings

# The local cron misses new archetypes when the machine is off. This CI job
# runs the stateless scraper weekly; scoring stays local with the raw deck store.
on:
  schedule:
    # Mondays 10:00 UTC, once weekend decklists are up.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-pairings
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          workspace: analysis

      - name: Prepare dated branch
        run: |
          BRANCH="automated/pairings-$(date -u +%F)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main

      - name: Sync pairings
        run: |
          cd analysis
          yarn sync-pairings

      - name: Check the analysis changes
        id: typecheck
        continue-on-error: true
        working-directory: analysis
        run: yarn typecheck

      - name: Test the analysis changes
        id: tests
        continue-on-error: true
        working-directory: analysis
        run: yarn test

      - name: Open a pull request if the pairings changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          if [ ! -f analysis/src/data/limitless-decks.json ]; then
            echo "limitless-decks.json missing after scrape; store path moved or scraper failed."
            exit 1
          fi

          if [ -z "$(git status --porcelain analysis/src/data/limitless-decks.json)" ]; then
            echo "No listing changes today."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add analysis/src/data/limitless-decks.json
          git commit -m "chore(data): sync deck listings from Limitless"
          # Fetch the branch so --force-with-lease checks against the real remote, not a stale local ref.
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"

          gh label create automated 2>/dev/null || true
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number,isDraft,labels)
          OPEN_PR=$(printf '%s' "$OPEN_PRS" | jq -c 'first // empty')
          PR_NUMBER=""
          PR_IS_DRAFT=false
          PR_IS_AUTOMATED=false
          if [ -n "$OPEN_PR" ]; then
            PR_NUMBER=$(printf '%s' "$OPEN_PR" | jq -r '.number')
            PR_IS_DRAFT=$(printf '%s' "$OPEN_PR" | jq -r '.isDraft')
            case "$BRANCH" in
              automated/pairings-*)
                if printf '%s' "$OPEN_PR" | jq -e 'any(.labels[]; .name == "automated")' >/dev/null; then
                  PR_IS_AUTOMATED=true
                fi
                ;;
            esac
          fi

          if [ "$TYPECHECK" = "success" ] && [ "$TESTS" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              gh pr create \
                --base main \
                --title "chore(data): Sync deck pairings ($(date -u +%F))" \
                --body "Automated weekly scrape of Limitless deck pairings. New partners are folded onto existing archetypes; nothing is pruned. Analysis typecheck and tests ran in this job before the PR opened." \
                --label automated
            elif [ "$PR_IS_AUTOMATED" = true ] && [ "$PR_IS_DRAFT" = true ]; then
              gh pr ready "$PR_NUMBER"
            fi
          else
            if [ -n "$PR_NUMBER" ]; then
              if [ "$PR_IS_AUTOMATED" = true ] && [ "$PR_IS_DRAFT" = false ]; then
                gh pr ready --undo "$PR_NUMBER" || true
              fi
            else
              FAILED_CHECKS=""
              if [ "$TYPECHECK" = "failure" ]; then
                FAILED_CHECKS="typecheck"
              fi
              if [ "$TESTS" = "failure" ]; then
                if [ -n "$FAILED_CHECKS" ]; then
                  FAILED_CHECKS="$FAILED_CHECKS and tests"
                else
                  FAILED_CHECKS="tests"
                fi
              fi
              gh pr create \
                --draft \
                --base main \
                --title "chore(data): Sync deck pairings ($(date -u +%F))" \
                --body "Analysis $FAILED_CHECKS failed. See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
                --label automated
            fi
          fi

      - name: Fail when analysis checks fail
        if: steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
